<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Админка — Стена</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  body{ background:var(--night-2); }
  .admin-page{ max-width:1000px; margin:0 auto; padding:24px 16px 60px; }
  .admin-page h1{ font-size:22px; margin-bottom:16px; }
  .login-box{
    max-width:320px; margin:80px auto; background:var(--card); border:1px solid var(--card-border);
    border-radius:var(--radius-l); padding:24px; text-align:center;
  }
  .login-box input{
    width:100%; background:var(--night-3); border:1px solid var(--card-border); color:var(--text);
    border-radius:var(--radius-s); padding:10px 12px; font-size:14px; margin:14px 0; outline:none;
  }
  .login-box button{
    border:none; border-radius:999px; padding:9px 20px; font-weight:700; font-size:14px; cursor:pointer;
    background:linear-gradient(135deg, var(--ice), #3a7d8c); color:#08272c;
  }
  .login-error{ color:var(--down); font-size:12.5px; min-height:16px; }

  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    border:1px solid var(--card-border); background:var(--card); color:var(--text-dim);
    border-radius:999px; padding:7px 16px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .tab-btn.active{ color:#08272c; background:linear-gradient(135deg, var(--ice), #3a7d8c); border-color:transparent; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .admin-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .admin-table th, .admin-table td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--card-border); vertical-align:top; }
  .admin-table th{ color:var(--text-dim); font-weight:700; font-size:11px; text-transform:uppercase; }
  .admin-table td.text-cell{ max-width:280px; white-space:pre-wrap; word-break:break-word; }
  .flag-badge{ background:var(--down); color:#fff; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; }
  .row-actions{ display:flex; gap:6px; }
  .row-actions button{
    border:1px solid var(--card-border); background:var(--night-3); color:var(--text); border-radius:6px;
    padding:4px 9px; font-size:12px; cursor:pointer;
  }
  .row-actions button.danger{ color:var(--down); border-color:var(--down); }
  .table-wrap{ overflow-x:auto; border:1px solid var(--card-border); border-radius:var(--radius-m); }

  .geo-list{ display:flex; flex-direction:column; gap:6px; max-width:400px; }
  .geo-row{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .geo-row .bar{ height:8px; background:var(--ice); border-radius:4px; }
  .geo-row .code{ width:70px; color:var(--text-dim); font-size:12px; }
  .geo-row .count{ width:40px; text-align:right; font-weight:700; }
</style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>Вход в админку</h2>
      <input type="password" id="admin-password" placeholder="Пароль" autocomplete="off" />
      <div id="login-error" class="login-error"></div>
      <button id="login-btn">Войти</button>
    </div>
  </div>

  <div id="admin-screen" class="admin-page" style="display:none">
    <h1>Админка стены</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="comments">Комментарии</button>
      <button class="tab-btn" data-tab="geo">География</button>
    </div>

    <div id="tab-comments" class="tab-panel active">
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Дата</th><th>Имя</th><th>Текст</th><th>Флаг</th><th>IP</th><th>Действия</th></tr>
          </thead>
          <tbody id="comments-body"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-geo" class="tab-panel">
      <p id="geo-status" style="color:var(--text-dim); font-size:13px;">Загрузка…</p>
      <div id="geo-list" class="geo-list"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let adminPassword = sessionStorage.getItem('admin-password') || '';

    function apiHeaders() {
      return { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword };
    }

    function showAdmin() {
      $('login-screen').style.display = 'none';
      $('admin-screen').style.display = 'block';
      loadComments();
    }

    function tryLogin(password) {
      return fetch('/api/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password })
      }).then(r => r.json());
    }

    $('login-btn').addEventListener('click', () => {
      const pass = $('admin-password').value;
      tryLogin(pass).then(res => {
        if (!res.ok) { $('login-error').textContent = res.error || 'Ошибка'; return; }
        adminPassword = pass;
        sessionStorage.setItem('admin-password', pass);
        showAdmin();
      });
    });
    $('admin-password').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });

    // Если пароль уже есть в сессии — проверяем и сразу пускаем
    if (adminPassword) {
      tryLogin(adminPassword).then(res => { if (res.ok) showAdmin(); });
    }

    // ---------- Вкладки ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + btn.dataset.tab));
        if (btn.dataset.tab === 'geo') loadGeo();
      });
    });

    // ---------- Комментарии ----------
    function loadComments() {
      fetch('/api/admin/comments', { headers: apiHeaders() }).then(r => r.json()).then(res => {
        if (!res.ok) return;
        const tbody = $('comments-body');
        tbody.innerHTML = '';
        res.comments.slice().reverse().forEach(c => {
          const tr = document.createElement('tr');
          const date = new Date(c.ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
          tr.innerHTML = `
            <td>${date}</td>
            <td>${c.name}${c.parentId ? ' <span style="color:var(--text-dim)">(ответ)</span>' : ''}</td>
            <td class="text-cell">${c.text}</td>
            <td>${c.flagged ? '<span class="flag-badge">флаг</span>' : ''}</td>
            <td>${c.ip || '—'}</td>
            <td><div class="row-actions">
              <button data-act="edit" data-id="${c.id}">Править</button>
              <button data-act="delete" data-id="${c.id}" class="danger">Удалить</button>
            </div></td>`;
          tbody.appendChild(tr);
        });
      });
    }

    $('comments-body').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.act === 'delete') {
        if (!confirm('Удалить комментарий (и ответы на него)?')) return;
        fetch('/api/admin/comments/' + id, { method: 'DELETE', headers: apiHeaders() })
          .then(r => r.json()).then(() => loadComments());
      } else if (btn.dataset.act === 'edit') {
        const row = btn.closest('tr');
        const currentText = row.querySelector('.text-cell').textContent;
        const newText = prompt('Новый текст комментария:', currentText);
        if (newText === null) return;
        fetch('/api/admin/comments/' + id, {
          method: 'PUT', headers: apiHeaders(), body: JSON.stringify({ text: newText })
        }).then(r => r.json()).then(() => loadComments());
      }
    });

    // ---------- География ----------
    function loadGeo() {
      $('geo-status').textContent = 'Загрузка…';
      fetch('/api/admin/geo', { headers: apiHeaders() }).then(r => r.json()).then(res => {
        if (!res.ok) { $('geo-status').textContent = res.error || 'Ошибка'; return; }
        $('geo-status').textContent = `Всего посещений: ${res.total}`;
        const list = $('geo-list');
        list.innerHTML = '';
        const max = res.countries[0] ? res.countries[0].count : 1;
        res.countries.forEach(c => {
          const row = document.createElement('div');
          row.className = 'geo-row';
          const widthPct = Math.max(4, Math.round((c.count / max) * 100));
          row.innerHTML = `
            <span class="code">${c.flag} ${c.code}</span>
            <span class="bar" style="width:${widthPct}%"></span>
            <span class="count">${c.count}</span>`;
          list.appendChild(row);
        });
      });
    }
  </script>
</body>
</html>
